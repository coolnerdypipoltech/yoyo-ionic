<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/yoyo-ionic/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" user-scalable="no"   />
    <title>yoyo-ionic</title>
    <style>
      /* Inline, so it applies on first paint — before main.tsx's CSS
         imports have downloaded and parsed — otherwise the WebView's own
         default (white) background shows through for a beat on native,
         which is what "app opened white instead of dark" actually was. */
      html, body { background: #000000; }
      :root { color-scheme: dark; }
    </style>

    <script>
      // Other half of the public/404.html redirect — unpacks the real
      // path from the query string and restores it via history so the
      // router sees the route the user actually asked for.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="module" crossorigin src="/yoyo-ionic/assets/index-s3s2cjtb.js"></script>
    <link rel="modulepreload" crossorigin href="/yoyo-ionic/assets/p-CHqRYvYm-BkhF1eTS.js">
    <link rel="modulepreload" crossorigin href="/yoyo-ionic/assets/p-ZjP4CjeZ-DJ1DGIsW.js">
    <link rel="stylesheet" crossorigin href="/yoyo-ionic/assets/index-DId5QDpL.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
