<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>yoyo-ionic</title>
    <script>
      // GitHub Pages has no server-side SPA fallback — a hard refresh or
      // deep link on any route other than "/" 404s here instead of ever
      // reaching index.html. This repacks the real path into a query
      // string and redirects to the site root, where the matching script
      // in index.html unpacks it and hands it to the router.
      // Pattern: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // "/yoyo-ionic"
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
